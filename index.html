<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#111418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Finanzas</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #111418;
  --surface:  #1a1f27;
  --surface2: #222832;
  --border:   rgba(255,255,255,0.07);
  --border2:  rgba(255,255,255,0.13);
  --text:     #eef0f5;
  --muted:    #6b7385;
  --green:    #3ecf8e;
  --red:      #f56565;
  --yellow:   #f6c90e;
  --purple:   #8b73f7;
  --accent:   #8b73f7;
  --radius:   14px;
  --rsm:      8px;
  --mono:     'DM Mono', monospace;
  --display:  'Syne', sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:var(--mono);background:var(--bg);color:var(--text);max-width:430px;margin:0 auto;display:flex;flex-direction:column}

/* ── HEADER ── */
.header{
  flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px 10px;
  border-bottom:1px solid var(--border);
  background:var(--bg);
}
.logo{font-family:var(--display);font-size:19px;font-weight:800;letter-spacing:-.5px}
.sync-pill{
  display:flex;align-items:center;gap:5px;
  font-size:10px;color:var(--muted);
  background:var(--surface);border:1px solid var(--border);
  padding:4px 10px;border-radius:20px;cursor:pointer;transition:.2s;
  white-space:nowrap;
}
.sync-pill.ok{color:var(--green);border-color:rgba(62,207,142,.25)}
.sync-pill.err{color:var(--red);border-color:rgba(245,101,101,.25)}
.sync-pill.syncing{color:var(--purple);border-color:rgba(139,115,247,.25)}
.sdot{width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0}
.sdot.pulse{animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

/* ── SCROLL AREA ── */
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{display:none}

/* ── BOTTOM NAV ── */
.nav{
  flex-shrink:0;
  display:flex;align-items:center;
  padding:8px 12px 22px;
  border-top:1px solid var(--border);
  background:var(--bg);gap:4px;
}
.nbtn{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  background:none;border:none;color:var(--muted);cursor:pointer;
  font-size:9px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.5px;
  padding:7px 2px;border-radius:var(--rsm);transition:.15s;position:relative;
}
.nbtn.active{color:var(--text);background:var(--surface)}
.nbtn svg{width:19px;height:19px;stroke-width:1.7}
.nadd{
  width:50px;height:50px;border-radius:50%;flex-shrink:0;
  background:var(--accent);border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 18px rgba(139,115,247,.45);transition:.2s;
}
.nadd:active{transform:scale(.92)}
.nadd svg{width:22px;height:22px;color:#fff;stroke-width:2.5}
.badge-dot{
  position:absolute;top:4px;right:8px;
  width:15px;height:15px;border-radius:50%;
  background:var(--red);color:#fff;
  font-size:8px;font-weight:700;
  display:none;align-items:center;justify-content:center;
}

/* ── VIEWS ── */
.view{display:none;padding-bottom:8px}
.view.on{display:block}

/* ── RESUMEN ── */
.hero{padding:18px 18px 0}
.mes-tag{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:3px}
.balance{font-family:var(--display);font-size:40px;font-weight:800;letter-spacing:-1.5px;margin-bottom:14px;transition:color .3s}
.balance.pos{color:var(--green)}
.balance.neg{color:var(--red)}
.cards2{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}
.card2{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:13px}
.card2-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:5px}
.card2-val{font-family:var(--display);font-size:21px;font-weight:700}
.card2-val.ing{color:var(--green)}
.card2-val.eg{color:var(--red)}
.bar-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:13px;margin-bottom:16px}
.bar-top{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-bottom:9px}
.bar-bg{height:5px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--green),var(--purple));transition:width .5s ease}
.sec-title{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;padding:0 18px;margin-bottom:8px}

/* ── FILAS DE MOVIMIENTO ── */
.mov{
  display:flex;align-items:center;gap:11px;
  padding:11px 18px;border-bottom:1px solid var(--border);
  animation:fadeIn .18s ease;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.mov-pill{
  flex-shrink:0;padding:3px 9px;border-radius:5px;
  font-size:10px;font-weight:500;white-space:nowrap;
  max-width:90px;overflow:hidden;text-overflow:ellipsis;
}
.mov-mid{flex:1;min-width:0}
.mov-det{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mov-sub{font-size:10px;color:var(--muted);margin-top:1px}
.mov-right{text-align:right;flex-shrink:0}
.mov-monto{font-family:var(--display);font-size:14px;font-weight:700}
.mov-monto.ing{color:var(--green)}
.mov-monto.eg{color:var(--red)}
.mov-fecha{font-size:10px;color:var(--muted)}
.ptag{font-size:9px;background:rgba(139,115,247,.18);color:var(--purple);border-radius:3px;padding:1px 5px;margin-left:4px}
.empty{text-align:center;padding:36px 20px;color:var(--muted);font-size:12px;line-height:1.8}

/* ── HISTORIAL TABS ── */
.tabs{display:flex;gap:5px;padding:12px 18px 8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  padding:5px 13px;border-radius:20px;font-size:11px;
  border:1px solid var(--border);background:none;color:var(--muted);
  cursor:pointer;white-space:nowrap;font-family:var(--mono);transition:.15s;
}
.tab.active{background:var(--surface2);border-color:var(--border2);color:var(--text)}

/* ── ALERTAS ── */
.al-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 18px;border-bottom:1px solid var(--border);
}
.al-left{}
.al-nombre{font-size:13px}
.al-fecha{font-size:10px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:5px}
.al-dias{font-size:9px;padding:1px 7px;border-radius:99px}
.al-dias.soon{background:rgba(246,201,14,.12);color:var(--yellow)}
.al-dias.ok{background:rgba(62,207,142,.1);color:var(--green)}
.al-dias.vencido{background:rgba(245,101,101,.12);color:var(--red)}
.al-right{display:flex;align-items:center;gap:8px}
.al-monto{font-family:var(--display);font-size:15px;font-weight:700;color:var(--red)}
.btn-x{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;line-height:1;padding:2px 4px}
.form-blk{padding:14px 18px}
.flabel{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:5px;display:block}
.finput{
  width:100%;background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--rsm);color:var(--text);font-family:var(--mono);
  font-size:14px;padding:10px 13px;outline:none;transition:border-color .2s;margin-bottom:10px;
}
.finput:focus{border-color:var(--accent)}
.finput option{background:var(--surface2)}
.btn-pri{
  width:100%;background:var(--accent);color:#fff;border:none;
  border-radius:var(--radius);font-family:var(--display);font-size:15px;
  font-weight:700;padding:13px;cursor:pointer;transition:.2s;
}
.btn-pri:active{transform:scale(.98)}
.btn-sec{
  width:100%;background:var(--surface);border:1px solid var(--border);
  color:var(--text);border-radius:var(--radius);font-family:var(--display);
  font-size:14px;font-weight:600;padding:12px;cursor:pointer;margin-top:8px;
}

/* ── CONFIG ── */
.cfg-blk{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.cfg-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.cfg-val{font-size:12px;word-break:break-all;color:var(--muted)}

/* ── MODAL ── */
.overlay{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.72);z-index:200;
  backdrop-filter:blur(3px);align-items:flex-end;
}
.overlay.on{display:flex}
.modal{
  background:var(--surface);border-radius:22px 22px 0 0;
  width:100%;max-width:430px;margin:0 auto;
  padding-bottom:28px;
  animation:up .22s cubic-bezier(.34,1.2,.64,1);
  max-height:92vh;overflow-y:auto;
}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-handle{width:34px;height:4px;background:var(--border2);border-radius:99px;margin:11px auto 18px}
.modal-title{font-family:var(--display);font-size:17px;font-weight:700;padding:0 18px;margin-bottom:16px}

/* flujo toggle */
.flujo-toggle{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:0 18px;margin-bottom:14px}
.ftbtn{
  padding:9px;border-radius:var(--rsm);border:1px solid var(--border);
  background:var(--surface2);color:var(--muted);font-family:var(--mono);
  font-size:12px;cursor:pointer;transition:.15s;text-align:center;
}
.ftbtn.ing.on{background:rgba(62,207,142,.1);border-color:var(--green);color:var(--green)}
.ftbtn.eg.on{background:rgba(245,101,101,.1);border-color:var(--red);color:var(--red)}

/* monto grande */
.monto-big{
  font-family:var(--display);font-size:32px;font-weight:800;
  width:100%;background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--rsm);color:var(--text);padding:10px 13px;
  outline:none;transition:border-color .2s;margin-bottom:10px;
}
.monto-big:focus{border-color:var(--accent)}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="logo">finanzas</div>
  <div class="sync-pill" id="syncPill" onclick="syncNow()">
    <div class="sdot" id="sdot"></div>
    <span id="syncTxt">offline</span>
  </div>
</div>

<!-- SCROLL CONTENT -->
<div class="scroll" id="scroll">

  <!-- VIEW RESUMEN -->
  <div class="view on" id="vResumen">
    <div class="hero">
      <div class="mes-tag" id="mesTag">—</div>
      <div class="balance" id="balanceEl">$0</div>
      <div class="cards2">
        <div class="card2"><div class="card2-label">Ingresos</div><div class="card2-val ing" id="sumIng">$0</div></div>
        <div class="card2"><div class="card2-label">Egresos</div><div class="card2-val eg" id="sumEg">$0</div></div>
      </div>
      <div class="bar-wrap">
        <div class="bar-top"><span>Egresos / Ingresos</span><span id="barPorc">0%</span></div>
        <div class="bar-bg"><div class="bar-fill" id="barFill" style="width:0%"></div></div>
      </div>
    </div>
    <div class="sec-title">Últimos movimientos</div>
    <div id="resMovs"></div>
  </div>

  <!-- VIEW HISTORIAL -->
  <div class="view" id="vHistorial">
    <div class="tabs" id="tabsEl"></div>
    <div id="histMovs"></div>
  </div>

  <!-- VIEW ALERTAS -->
  <div class="view" id="vAlertas">
    <div style="height:12px"></div>
    <div class="sec-title">Recordatorios de pago</div>
    <div id="listaAl"></div>
    <div class="form-blk" style="margin-top:8px">
      <div class="sec-title" style="padding:0;margin-bottom:12px">Nuevo recordatorio</div>
      <label class="flabel">Nombre / Concepto</label>
      <input class="finput" id="alNombre" placeholder="ej. Alquiler" />
      <label class="flabel">Monto estimado</label>
      <input class="finput" id="alMonto" type="number" inputmode="decimal" placeholder="0" />
      <label class="flabel">Día del mes que vence</label>
      <input class="finput" id="alDia" type="number" min="1" max="31" placeholder="ej. 10" />
      <button class="btn-pri" onclick="addAlerta()">Guardar recordatorio</button>
    </div>
  </div>

  <!-- VIEW CONFIG -->
  <div class="view" id="vConfig">
    <div class="form-blk">
      <div class="cfg-blk">
        <div class="cfg-label">URL de Apps Script</div>
        <div class="cfg-val" id="cfgUrlDisplay">No configurada</div>
        <input class="finput" id="cfgUrl" placeholder="https://script.google.com/macros/s/.../exec" style="margin-top:8px;margin-bottom:0" />
      </div>
      <div class="cfg-blk">
        <div class="cfg-label">Movimientos sin sincronizar</div>
        <div class="cfg-val" id="cfgPending">0</div>
      </div>
      <div class="cfg-blk">
        <div class="cfg-label">Total movimientos locales</div>
        <div class="cfg-val" id="cfgTotal">0</div>
      </div>
      <button class="btn-pri" onclick="guardarCfg()" style="margin-top:4px">Guardar URL</button>
      <button class="btn-sec" onclick="syncNow()">Sincronizar ahora</button>
      <button class="btn-sec" onclick="cargarDesdeSheet()" style="margin-top:8px">Importar desde Sheet ↓</button>
    </div>
  </div>

</div><!-- /scroll -->

<!-- BOTTOM NAV -->
<nav class="nav">
  <button class="nbtn active" id="nbResumen" onclick="goView('Resumen')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    Resumen
  </button>
  <button class="nbtn" id="nbHistorial" onclick="goView('Historial')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="12" y2="16"/></svg>
    Historial
  </button>
  <button class="nadd" onclick="abrirModal()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </button>
  <button class="nbtn" id="nbAlertas" onclick="goView('Alertas')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
    Alertas
    <div class="badge-dot" id="badgeDot">0</div>
  </button>
  <button class="nbtn" id="nbConfig" onclick="goView('Config')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
    Config
  </button>
</nav>

<!-- MODAL NUEVO MOVIMIENTO -->
<div class="overlay" id="overlay" onclick="cerrarModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <div class="modal-title">Nuevo movimiento</div>

    <div class="flujo-toggle">
      <button class="ftbtn ing on" id="ftIng" onclick="setFlujo('ingreso')">+ Ingreso</button>
      <button class="ftbtn eg"    id="ftEg"  onclick="setFlujo('egreso')">- Egreso</button>
    </div>

    <div style="padding:0 18px">
      <label class="flabel">Monto</label>
      <input class="monto-big" id="mMonto" type="number" inputmode="decimal" placeholder="0" />

      <label class="flabel">Concepto</label>
      <select class="finput" id="mConcepto"></select>

      <label class="flabel">Detalle</label>
      <input class="finput" id="mDetalle" placeholder="Descripción libre" />

      <label class="flabel">Estado</label>
      <select class="finput" id="mEstado">
        <option value="Pagado">Pagado</option>
        <option value="Vencido">Vencido</option>
        <option value="Pendiente">Pendiente</option>
      </select>

      <label class="flabel">Fecha</label>
      <input class="finput" id="mFecha" type="date" />

      <label class="flabel">Vencimiento (opcional)</label>
      <input class="finput" id="mVenc" type="date" />

      <button class="btn-pri" onclick="guardarMov()" style="margin-top:4px">Guardar</button>
    </div>
  </div>
</div>

<script>
// ── STORAGE ──
const K = {
  movs:      'fin_movs',
  unsynced:  'fin_unsynced',
  alertas:   'fin_alertas',
  cfg:       'fin_cfg',
  conceptos: 'fin_conceptos',
};
const get  = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch { return null; } };
const save = (k,v) => localStorage.setItem(k, JSON.stringify(v));

// ── CONCEPTOS con colores (igual que el Sheet) ──
const CONCEPTOS_DEFAULT = [
  { nombre:'Depósito',       bg:'#b7e1cd', text:'#000' },
  { nombre:'Inversión',      bg:'#d9d2e9', text:'#000' },
  { nombre:'Compras',        bg:'#fce8b2', text:'#000' },
  { nombre:'Gastos Varios',  bg:'#a61c00', text:'#fff' },
  { nombre:'Magui',          bg:'#cc0000', text:'#fff' },
  { nombre:'Obra social',    bg:'#e69138', text:'#000' },
  { nombre:'Extraordinario', bg:'#674ea7', text:'#fff' },
];

function getConceptos() {
  return get(K.conceptos) || CONCEPTOS_DEFAULT;
}
function colorConcepto(nombre) {
  const c = getConceptos().find(c => c.nombre === nombre);
  return c || { bg:'#333', text:'#fff' };
}

// ── HELPERS ──
const hoy = () => new Date().toISOString().split('T')[0];
const fmt = n => '$' + Number(n).toLocaleString('es-AR', { minimumFractionDigits:0, maximumFractionDigits:2 });
const fmtF = d => { if (!d) return ''; const [y,m,dd] = d.split('-'); return `${dd}/${m}/${y}`; };
const mesDe = d => d ? d.substring(0,7) : '';
const mesNombre = d => {
  if (!d) return '';
  const MM = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const [y,m] = d.split('-'); return `${MM[+m-1]} ${y}`;
};
const mesNombreLargo = d => {
  if (!d) return '';
  const MM = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const [y,m] = d.split('-'); return `${MM[+m-1]} ${y}`;
};
const getMovs    = () => get(K.movs)     || [];
const getUnsynced= () => get(K.unsynced) || [];
const getAlertas = () => get(K.alertas)  || [];
const getCfg     = () => get(K.cfg)      || {};

// ── VIEW ROUTING ──
let curView = 'Resumen';
function goView(v) {
  curView = v;
  ['Resumen','Historial','Alertas','Config'].forEach(id => {
    document.getElementById('v'+id).classList.toggle('on', id === v);
    document.getElementById('nb'+id).classList.toggle('active', id === v);
  });
  document.getElementById('scroll').scrollTop = 0;
  if (v === 'Resumen')  renderResumen();
  if (v === 'Historial') renderHistorial();
  if (v === 'Alertas')  renderAlertas();
  if (v === 'Config')   renderConfig();
}

// ── RENDER MOVIMIENTO ROW ──
function movRow(m) {
  const cc = colorConcepto(m.concepto);
  const esIng = m.flujo === 'ingreso';
  const monto = esIng ? m.ingreso : m.egreso;
  const ptag = m.synced === false ? '<span class="ptag">↑</span>' : '';
  const pill = `<div class="mov-pill" style="background:${cc.bg};color:${cc.text}">${m.concepto||'—'}</div>`;
  const vencTxt = m.vencimiento ? `Vence ${fmtF(m.vencimiento)}` : '';
  return `<div class="mov">
    ${pill}
    <div class="mov-mid">
      <div class="mov-det">${m.detalle||'—'}${ptag}</div>
      <div class="mov-sub">${m.estado||''}${vencTxt ? ' · '+vencTxt : ''}</div>
    </div>
    <div class="mov-right">
      <div class="mov-monto ${esIng?'ing':'eg'}">${esIng?'+':'-'}${fmt(monto)}</div>
      <div class="mov-fecha">${fmtF(m.fecha)}</div>
    </div>
  </div>`;
}

// ── RESUMEN ──
function renderResumen() {
  const movs = getMovs();
  const mes = hoy().substring(0,7);
  const del = movs.filter(m => mesDe(m.fecha) === mes);
  const ing = del.reduce((a,m) => a + (Number(m.ingreso)||0), 0);
  const eg  = del.reduce((a,m) => a + (Number(m.egreso)||0), 0);
  const bal = ing - eg;
  const porc = ing > 0 ? Math.min(100, Math.round(eg/ing*100)) : 0;

  document.getElementById('mesTag').textContent = mesNombreLargo(mes+'-01');
  const bEl = document.getElementById('balanceEl');
  bEl.textContent = fmt(bal);
  bEl.className = 'balance ' + (bal >= 0 ? 'pos' : 'neg');
  document.getElementById('sumIng').textContent = fmt(ing);
  document.getElementById('sumEg').textContent  = fmt(eg);
  document.getElementById('barPorc').textContent = porc+'%';
  document.getElementById('barFill').style.width = porc+'%';

  const ultimos = [...movs].sort((a,b) => b.fecha.localeCompare(a.fecha)).slice(0,10);
  const wrap = document.getElementById('resMovs');
  wrap.innerHTML = ultimos.length
    ? ultimos.map(movRow).join('')
    : '<div class="empty">Sin movimientos aún.<br>Tocá + para agregar.</div>';
}

// ── HISTORIAL ──
let mesFiltro = null;
function renderHistorial() {
  const movs = getMovs();
  const meses = [...new Set(movs.map(m => mesDe(m.fecha)))].filter(Boolean).sort().reverse();
  if (!mesFiltro || !meses.includes(mesFiltro)) mesFiltro = meses[0] || hoy().substring(0,7);

  document.getElementById('tabsEl').innerHTML = meses.map(m =>
    `<button class="tab${m===mesFiltro?' active':''}" onclick="setMes('${m}')">${mesNombre(m+'-01')}</button>`
  ).join('');

  const del = movs.filter(m => mesDe(m.fecha) === mesFiltro).sort((a,b) => b.fecha.localeCompare(a.fecha));
  document.getElementById('histMovs').innerHTML = del.length
    ? del.map(movRow).join('')
    : '<div class="empty">Sin movimientos en este mes.</div>';
}
function setMes(m) { mesFiltro = m; renderHistorial(); }

// ── ALERTAS ──
function renderAlertas() {
  const als = getAlertas();
  const hoyDia = new Date().getDate();
  const wrap = document.getElementById('listaAl');

  if (!als.length) {
    wrap.innerHTML = '<div class="empty" style="padding:16px 0 0">Sin recordatorios.</div>';
  } else {
    wrap.innerHTML = als.map((a,i) => {
      const diff = a.dia - hoyDia;
      const label = diff === 0 ? '¡Hoy!' : diff > 0 ? `${diff}d` : 'Vencido';
      const cls   = diff < 0 ? 'vencido' : diff <= 3 ? 'soon' : 'ok';
      return `<div class="al-item">
        <div class="al-left">
          <div class="al-nombre">${a.nombre}</div>
          <div class="al-fecha">Día ${a.dia} <span class="al-dias ${cls}">${label}</span></div>
        </div>
        <div class="al-right">
          <div class="al-monto">${fmt(a.monto)}</div>
          <button class="btn-x" onclick="delAlerta(${i})">×</button>
        </div>
      </div>`;
    }).join('');
  }

  // badge en nav
  const urgentes = als.filter(a => { const d = a.dia - new Date().getDate(); return d >= 0 && d <= 3; });
  const dot = document.getElementById('badgeDot');
  dot.textContent = urgentes.length;
  dot.style.display = urgentes.length ? 'flex' : 'none';
}
function addAlerta() {
  const nombre = document.getElementById('alNombre').value.trim();
  const monto  = parseFloat(document.getElementById('alMonto').value);
  const dia    = parseInt(document.getElementById('alDia').value);
  if (!nombre || !monto || !dia || dia<1 || dia>31) { alert('Completá todos los campos'); return; }
  const als = getAlertas();
  als.push({ nombre, monto, dia });
  save(K.alertas, als);
  document.getElementById('alNombre').value = '';
  document.getElementById('alMonto').value  = '';
  document.getElementById('alDia').value    = '';
  renderAlertas();
}
function delAlerta(i) {
  const als = getAlertas(); als.splice(i,1); save(K.alertas, als); renderAlertas();
}

// ── CONFIG ──
function renderConfig() {
  const cfg = getCfg();
  document.getElementById('cfgUrlDisplay').textContent = cfg.url || 'No configurada';
  document.getElementById('cfgUrl').value = cfg.url || '';
  document.getElementById('cfgPending').textContent = getUnsynced().length;
  document.getElementById('cfgTotal').textContent   = getMovs().length;
}
function guardarCfg() {
  const url = document.getElementById('cfgUrl').value.trim();
  if (!url) { alert('Ingresá la URL'); return; }
  const cfg = getCfg(); cfg.url = url; save(K.cfg, cfg);
  document.getElementById('cfgUrlDisplay').textContent = url;
  syncNow();
}

// ── MODAL ──
let flujoActual = 'ingreso';
function abrirModal() {
  llenarConceptos();
  document.getElementById('mFecha').value = hoy();
  document.getElementById('mVenc').value  = '';
  document.getElementById('mMonto').value = '';
  document.getElementById('mDetalle').value = '';
  document.getElementById('mEstado').value = 'Pagado';
  document.getElementById('overlay').classList.add('on');
  setTimeout(() => document.getElementById('mMonto').focus(), 300);
}
function cerrarModal(e) {
  if (e.target === document.getElementById('overlay'))
    document.getElementById('overlay').classList.remove('on');
}
function setFlujo(f) {
  flujoActual = f;
  document.getElementById('ftIng').classList.toggle('on', f==='ingreso');
  document.getElementById('ftEg').classList.toggle('on',  f==='egreso');
}
function llenarConceptos() {
  const sel = document.getElementById('mConcepto');
  sel.innerHTML = getConceptos().map(c => `<option value="${c.nombre}">${c.nombre}</option>`).join('');
}

function guardarMov() {
  const monto   = parseFloat(document.getElementById('mMonto').value);
  const concepto= document.getElementById('mConcepto').value;
  const detalle = document.getElementById('mDetalle').value.trim();
  const estado  = document.getElementById('mEstado').value;
  const fecha   = document.getElementById('mFecha').value;
  const venc    = document.getElementById('mVenc').value;

  if (!monto || monto <= 0) { alert('Ingresá un monto'); return; }
  if (!fecha) { alert('Seleccioná una fecha'); return; }

  const esIng = flujoActual === 'ingreso';
  const mov = {
    id:          Date.now().toString(),
    flujo:       flujoActual,
    fecha,
    vencimiento: venc || '',
    concepto,
    detalle,
    estado,
    ingreso:     esIng ? monto : 0,
    egreso:      esIng ? 0 : monto,
    synced:      false,
    ts:          new Date().toISOString(),
  };

  const movs = getMovs(); movs.push(mov); save(K.movs, movs);
  const un = getUnsynced(); un.push(mov); save(K.unsynced, un);

  document.getElementById('overlay').classList.remove('on');
  updateSyncPill();
  if (curView === 'Resumen')   renderResumen();
  if (curView === 'Historial') renderHistorial();
  syncNow();
}

// ── SYNC ──
function setSyncUI(state, txt) {
  const pill = document.getElementById('syncPill');
  const dot  = document.getElementById('sdot');
  pill.className = 'sync-pill ' + state;
  dot.className  = 'sdot' + (state==='syncing' ? ' pulse' : '');
  document.getElementById('syncTxt').textContent = txt;
}
function updateSyncPill() {
  const un = getUnsynced().length;
  if (!navigator.onLine) { setSyncUI('', `offline${un?' · '+un+' pend.':''}`); return; }
  if (un) { setSyncUI('', `${un} pend.`); return; }
  setSyncUI('ok', 'sincronizado');
}

async function syncNow() {
  const cfg = getCfg();
  if (!cfg.url) { setSyncUI('err','sin URL'); return; }
  const un = getUnsynced();
  if (!un.length) { setSyncUI('ok','sincronizado'); return; }
  if (!navigator.onLine) { setSyncUI('','offline'); return; }

  setSyncUI('syncing','sincronizando...');
  try {
    const res = await fetch(cfg.url, {
      method: 'POST',
      body: JSON.stringify({ movimientos: un }),
      headers: { 'Content-Type':'application/json' },
    });
    if (res.ok) {
      const ids = un.map(m => m.id);
      const movs = getMovs();
      movs.forEach(m => { if (ids.includes(m.id)) m.synced = true; });
      save(K.movs, movs);
      save(K.unsynced, []);
      setSyncUI('ok','sincronizado');
      if (curView === 'Resumen')   renderResumen();
      if (curView === 'Historial') renderHistorial();
      if (curView === 'Config')    renderConfig();
    } else {
      setSyncUI('err','error sync');
    }
  } catch {
    setSyncUI('err','error red');
  }
}

// Importar movimientos desde el Sheet (para tener historial en la app)
async function cargarDesdeSheet() {
  const cfg = getCfg();
  if (!cfg.url) { alert('Configurá la URL primero'); return; }
  if (!navigator.onLine) { alert('Necesitás conexión'); return; }

  setSyncUI('syncing','importando...');
  try {
    const mes = hoy().substring(0,7);
    const url = cfg.url + '?mes=' + mes;
    const res = await fetch(url);
    const data = await res.json();
    if (!data.ok) { setSyncUI('err','error'); return; }

    const movs = getMovs();
    const existIds = new Set(movs.map(m => m.id));
    let nuevos = 0;

    data.movimientos.forEach(m => {
      if (!m.fecha) return;
      const esIng = Number(m.ingreso) > 0;
      const mov = {
        id:          `sheet_${m.fecha}_${m.detalle}`.replace(/\s/g,'_'),
        flujo:       esIng ? 'ingreso' : 'egreso',
        fecha:       m.fecha,
        vencimiento: m.vencimiento || '',
        concepto:    m.concepto || '',
        detalle:     m.detalle || '',
        estado:      m.estado || '',
        ingreso:     Number(m.ingreso) || 0,
        egreso:      Number(m.egreso)  || 0,
        synced:      true,
        ts:          new Date().toISOString(),
      };
      if (!existIds.has(mov.id)) { movs.push(mov); nuevos++; }
    });

    save(K.movs, movs);
    setSyncUI('ok','sincronizado');
    alert(`Importados ${nuevos} movimientos de ${mesNombreLargo(mes+'-01')}`);
    renderConfig();
  } catch {
    setSyncUI('err','error red');
  }
}

// También importar conceptos del Sheet
async function cargarConceptos() {
  const cfg = getCfg();
  if (!cfg.url || !navigator.onLine) return;
  try {
    const res  = await fetch(cfg.url + '?action=conceptos');
    const data = await res.json();
    if (!data.ok) return;
    const existing = getConceptos().map(c => c.nombre);
    const nuevos = data.conceptos.filter(n => !existing.includes(n));
    if (nuevos.length) {
      const all = [...getConceptos(), ...nuevos.map(n => ({ nombre:n, bg:'#444', text:'#fff' }))];
      save(K.conceptos, all);
    }
  } catch {}
}

// ── ONLINE/OFFLINE ──
window.addEventListener('online',  () => { updateSyncPill(); syncNow(); });
window.addEventListener('offline', () => updateSyncPill());

// ── INIT ──
document.addEventListener('DOMContentLoaded', () => {
  updateSyncPill();
  renderResumen();
  renderAlertas();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
  cargarConceptos();
});
</script>
